get:
  x-eov-operation-id: getMultiUserCredentials
  x-eov-operation-handler: v1/handlers/credentials/credentials.handler
  tags:
    - Credential
  summary: Retrieve multi-user enabled credentials
  description: Retrieve all credentials that have useUserFilter enabled for multi-user workflows
  parameters:
    - $ref: '../../../../shared/spec/parameters/limit.yml'
    - $ref: '../../../../shared/spec/parameters/cursor.yml'
  responses:
    '200':
      description: Operation successful.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/credential.yml'
    '401':
      $ref: '../../../../shared/spec/responses/unauthorized.yml'
    '403':
      $ref: '../../../../shared/spec/responses/forbidden.yml'

post:
  x-eov-operation-id: createMultiUserCredential
  x-eov-operation-handler: v1/handlers/credentials/credentials.handler
  tags:
    - Credential
  summary: Create a multi-user credential mapping
  description: Create a mapping between a template credential and user-specific credential data
  requestBody:
    description: Multi-user credential mapping data
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - customUserId
            - templateCredentialId
            - credentialData
          properties:
            customUserId:
              type: string
              description: The custom user ID for this mapping
              example: 'user123'
            templateCredentialId:
              type: string
              description: The ID of the template credential
              example: 'template_456'
            credentialData:
              type: object
              description: The user-specific credential data
              example: { 'apiKey': 'user123-api-key', 'baseUrl': 'https://api.example.com' }
            description:
              type: string
              description: Optional description for this mapping
              example: 'API credentials for user123'
            additionalData:
              type: object
              description: Optional additional metadata
              example: { 'userType': 'customer' }
  responses:
    '200':
      description: Operation successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                description: The mapping ID
                example: 'mapping_789'
              customUserId:
                type: string
                description: The custom user ID
                example: 'user123'
              templateCredentialId:
                type: string
                description: The template credential ID
                example: 'template_456'
              description:
                type: string
                description: The mapping description
                example: 'API credentials for user123'
              isActive:
                type: boolean
                description: Whether the mapping is active
                example: true
              createdAt:
                type: string
                format: date-time
                description: When the mapping was created
                example: '2023-01-01T00:00:00.000Z'
              updatedAt:
                type: string
                format: date-time
                description: When the mapping was last updated
                example: '2023-01-01T00:00:00.000Z'
    '400':
      description: Bad request - missing or invalid parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 'customUserId, templateCredentialId, and credentialData are required'
    '401':
      $ref: '../../../../shared/spec/responses/unauthorized.yml'
    '403':
      description: Forbidden - only administrators can create multi-user credential mappings
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 'Only administrators can create credential mappings'
    '404':
      description: Template credential not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 'Template credential not found'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 'Internal server error'
