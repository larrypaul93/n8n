get:
  x-eov-operation-id: getMultiUserCredentialsByUser
  x-eov-operation-handler: v1/handlers/credentials/credentials.handler
  tags:
    - Credential
  summary: Retrieve multi-user credentials for a specific user
  description: Retrieve all multi-user credential mappings for a specific custom user ID with optional decrypted data
  parameters:
    - name: customUserId
      in: path
      description: The custom user ID to retrieve credentials for
      required: true
      schema:
        type: string
        example: 'user123'
    - name: includeData
      in: query
      description: Whether to include decrypted credential data in the response
      required: false
      schema:
        type: string
        enum: ['true', 'false']
        default: 'false'
        example: 'true'
    - name: templateCredentialId
      in: query
      description: Optional template credential ID to filter results
      required: false
      schema:
        type: string
        example: 'template_456'
  responses:
    '200':
      description: Operation successful.
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  description: The mapping ID
                  example: 'mapping_789'
                customUserId:
                  type: string
                  description: The custom user ID
                  example: 'user123'
                templateCredentialId:
                  type: string
                  description: The template credential ID
                  example: 'template_456'
                hasCredentialData:
                  type: boolean
                  description: Whether credential data exists for this mapping
                  example: true
                description:
                  type: string
                  description: The mapping description
                  example: 'API credentials for user123'
                additionalData:
                  type: object
                  description: Additional metadata for the mapping
                  example: { 'userType': 'customer' }
                isActive:
                  type: boolean
                  description: Whether the mapping is active
                  example: true
                createdAt:
                  type: string
                  format: date-time
                  description: When the mapping was created
                  example: '2023-01-01T00:00:00.000Z'
                updatedAt:
                  type: string
                  format: date-time
                  description: When the mapping was last updated
                  example: '2023-01-01T00:00:00.000Z'
                data:
                  type: object
                  description: Decrypted credential data (only included when includeData=true)
                  example: { 'apiKey': 'user123-api-key', 'baseUrl': 'https://api.example.com' }
    '400':
      description: Bad request - invalid parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 'Invalid customUserId parameter'
    '401':
      $ref: '../../../../shared/spec/responses/unauthorized.yml'
    '403':
      description: Forbidden - only administrators can access multi-user credential mappings
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 'Only administrators can view credential mappings'
    '404':
      description: Not found - no mappings found for the specified user
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "No credentials found for user 'user123' with template credential 'template_456'"
              customUserId:
                type: string
                example: 'user123'
              templateCredentialId:
                type: string
                example: 'template_456'
                description: 'Only present when templateCredentialId was specified in query'
              hasCredentials:
                type: boolean
                example: false
