post:
  x-eov-operation-id: getMultiUserOAuthUrl
  x-eov-operation-handler: v1/handlers/credentials/credentials.handler
  tags:
    - Credential
  summary: Get OAuth authorization URL for multi-user credential
  description: Generate an OAuth authorization URL for a multi-user credential to enable user authorization flows
  requestBody:
    description: Credential ID and custom user ID for OAuth URL generation
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - credentialId
            - customUserId
          properties:
            credentialId:
              type: string
              description: The ID of the multi-user credential
              example: 'abc123'
            customUserId:
              type: string
              description: The custom user ID for the authorization flow
              example: 'user@example.com'
  responses:
    '200':
      description: Operation successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              authUrl:
                type: string
                description: The OAuth authorization URL
                example: 'https://oauth.provider.com/auth?client_id=...'
              oauthType:
                type: string
                enum: [oauth1, oauth2]
                description: The type of OAuth flow
                example: 'oauth2'
              state:
                type: string
                description: The state parameter for the OAuth flow
                example: 'eyJjcmVkZW50aWFsSWQiOiJhYmMxMjMi...'
              credentialId:
                type: string
                description: The credential ID
                example: 'abc123'
              customUserId:
                type: string
                description: The custom user ID
                example: 'user@example.com'
              message:
                type: string
                description: Instructions for the OAuth flow
                example: 'Redirect user to authUrl to complete OAUTH2 authorization'
    '400':
      description: Bad request - missing parameters or credential not suitable for OAuth
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 'credentialId and customUserId are required'
    '401':
      $ref: '../../../../shared/spec/responses/unauthorized.yml'
    '403':
      description: Forbidden - only administrators can access multi-user OAuth credentials
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 'Only administrators can access multi-user OAuth credentials'
    '404':
      description: Credential not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 'Credential not found'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 'Internal server error'
